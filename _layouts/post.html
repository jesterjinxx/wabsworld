---
layout: default
---

<main class="page-shell">
  <article class="post">
    <a href="/blog.html" class="back-link">
      ← Back to Blog
    </a>
    
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }} · {{ page.category }}
    </p>

    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}

    <h1>{{ page.title }}</h1>

    {% if page.subtitle %}
      <h3 class="post-subtitle">{{ page.subtitle }}</h3>
    {% endif %}

    {{ content }}
  </article>
</main>
