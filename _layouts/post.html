---
layout: default
---

<main class="page-shell">
  <article class="post">
    <a href="/blog.html" class="back-link">
      ← Back to Blog
    </a>

    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }} · {{ page.category }}
    </p>

    <h1>{{ page.title }}</h1>

    {% if page.thumbnail %}
      <figure class="post-media post-media-featured">
        <img src="{{ page.thumbnail }}" alt="{{ page.title }}">
      </figure>
    {% endif %}

    {{ content }}
  </article>
</main>
